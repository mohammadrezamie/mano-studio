name: Release candidate full verification
on:
  push:
    branches:
      - release/stable-openssl-notice
      - release/beta-openssl-notice
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
permissions:
  contents: read
concurrency:
  group: release-candidate-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.os == 'windows-latest' && '3.14.10' || '3.12' }}
          architecture: x64
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core fonts-dejavu-core
      - name: Install ordinary Linux regression dependencies
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Isolate pinned Windows regression environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv (Join-Path $env:RUNNER_TEMP 'mano-regression-venv')
          if ($LASTEXITCODE -ne 0) { throw 'Regression venv failed.' }
          (Join-Path $env:RUNNER_TEMP 'mano-regression-venv\Scripts') >> $env:GITHUB_PATH
      - name: Install exact Windows candidate dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --report regression-wheel-report.json -c installer/windows-candidate-constraints.txt -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned regression dependency installation failed.' }
          python -m installer.wheel_evidence regression-wheel-report.json installer/windows-candidate-constraints.txt regression-wheel-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Regression wheel evidence rejected.' }
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Configure Windows fonts for Qt regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fonts = Join-Path $env:WINDIR 'Fonts'
          if (!(Test-Path $fonts)) { throw 'Windows font directory missing' }
          "QT_QPA_FONTDIR=$fonts" >> $env:GITHUB_ENV
      - name: Verify Qt import and actual glyph coverage
        run: |
          python -c "import PySide6"
          python render_preflight.py
      - name: Record exact regression environment
        shell: bash
        run: |
          git rev-parse HEAD > regression-source.txt
          python --version > regression-python.txt
          python -m pip freeze > regression-dependencies.txt
      - name: Run complete regression suite
        run: python -m pytest -q --durations=25 --junitxml=regression.xml
      - name: Capture actual desktop previews
        run: python capture_workspace.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-regression-${{ matrix.os }}
          path: |
            regression.xml
            regression-source.txt
            regression-python.txt
            regression-dependencies.txt
            regression-wheel-report.json
            regression-wheel-evidence.json
            screenshots/
          if-no-files-found: ignore
          retention-days: 30

  windows-candidate:
    needs: regression
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source revision
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[a-f0-9]{40}$') { throw 'Missing source SHA' }
          "MANO_SOURCE_SHA=$sha" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Isolate pinned Windows build environment
        shell: pwsh
        run: |
          python -m venv (Join-Path $env:RUNNER_TEMP 'mano-candidate-venv')
          if ($LASTEXITCODE -ne 0) { throw 'Candidate venv failed.' }
          (Join-Path $env:RUNNER_TEMP 'mano-candidate-venv\Scripts') >> $env:GITHUB_PATH
      - name: Install exact candidate wheels and verify provenance
        shell: pwsh
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --report build-wheel-report.json -c installer/windows-candidate-constraints.txt -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned candidate dependency installation failed.' }
          python -m installer.wheel_evidence build-wheel-report.json installer/windows-candidate-constraints.txt wheel-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Wheel provenance evidence rejected.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Candidate dependency conflict.' }
      - name: Verify build, notice and redistribution contracts
        run: python -m pytest -q tests/test_openssl_notice.py tests/test_qt_imageformats_notices.py tests/test_redistribution_gate.py tests/test_runtime_evidence.py tests/test_prune_qml.py tests/test_prune_pdf.py tests/test_windows_build_contract.py tests/test_candidate_manifest.py tests/test_review_evidence.py tests/test_collect_notices.py
      - name: Configure Windows fonts and verify glyphs
        shell: pwsh
        run: |
          $fonts = Join-Path $env:WINDIR 'Fonts'
          if (!(Test-Path $fonts)) { throw 'Windows font directory missing' }
          "QT_QPA_FONTDIR=$fonts" >> $env:GITHUB_ENV
          python render_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'Glyph preflight failed.' }
      - name: Build portable application with reviewed notices
        shell: pwsh
        run: ./installer/build.ps1 -PortableOnly -LeanPdf
      - name: Smoke test frozen portable application
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'mano-portable-smoke.txt'
          if (Test-Path $report) { Remove-Item $report -Force }
          $app = Join-Path $PWD 'dist\ManoStudio\ManoStudio.exe'
          $p = Start-Process -FilePath $app -ArgumentList ('--smoke-test "' + $report + '"') -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Portable smoke timed out.' }
          if ($p.ExitCode -ne 0 -or !(Test-Path $report) -or (Get-Content $report -Raw).Trim() -ne 'PASS') { throw 'Portable smoke failed.' }
      - name: Archive portable and produce exact review evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable-output | Out-Null
          $version = (python -c "from update_service import VERSION; print(VERSION)").Trim()
          $zip = "portable-output/ManoStudio-v$version-Windows-x64.zip"
          python -c "import shutil,sys; shutil.make_archive(sys.argv[1],'zip',root_dir='dist',base_dir='ManoStudio')" ($zip -replace '\.zip$', '')
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive failed.' }
          python -m pip freeze | Set-Content -Encoding utf8 portable-output/build-dependencies.txt
          "SHA=$env:MANO_SOURCE_SHA" | Set-Content -Encoding ascii portable-output/commit.txt
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() | Set-Content -Encoding ascii "$zip.sha256"
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mano-portable-smoke.txt') portable-output/portable-smoke.txt
          python -m installer.redistribution_gate $zip | Set-Content -Encoding utf8 portable-output/redistribution-preflight.json
          if ($LASTEXITCODE -notin @(0,2)) { throw 'Invalid redistribution evidence.' }
          python -m installer.runtime_evidence $zip portable-output/runtime-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Runtime evidence failed.' }
          Copy-Item wheel-evidence.json portable-output/
          Copy-Item build-wheel-report.json portable-output/
          Copy-Item installer/windows-candidate-constraints.txt portable-output/
      - uses: actions/upload-artifact@v4
        with:
          name: ManoStudio-Windows-x64-portable-review
          path: portable-output/
          if-no-files-found: error
          retention-days: 30
      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Build exact Setup from the tested portable payload
        shell: pwsh
        run: ./installer/build.ps1 -ReuseFrozen
      - name: Install, run standalone smoke and uninstall
        shell: pwsh
        run: ./installer/smoke.ps1
      - name: Record setup evidence and validate candidate manifest
        shell: pwsh
        run: |
          python -m pip freeze | Set-Content -Encoding utf8 installer/output/build-dependencies.txt
          "SHA=$env:MANO_SOURCE_SHA" | Set-Content -Encoding ascii installer/output/commit.txt
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mano-smoke.txt') installer/output/installed-smoke.txt
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mano-standalone-runtime.json') installer/output/standalone-runtime.json
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mano-installed-payload.json') installer/output/installed-payload.json
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mano-portable-smoke.txt') installer/output/portable-smoke.txt
          Copy-Item portable-output/redistribution-preflight.json installer/output/
          Copy-Item portable-output/runtime-evidence.json installer/output/
          Copy-Item wheel-evidence.json installer/output/
          Copy-Item build-wheel-report.json installer/output/
          Copy-Item installer/windows-candidate-constraints.txt installer/output/
          Get-ChildItem installer/output/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
          python -m installer.candidate_manifest --root . --sha "$env:MANO_SOURCE_SHA" --require-review
          if ($LASTEXITCODE -ne 0) { throw 'Candidate manifest rejected.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ManoStudio-Windows-x64-setup-review
          path: installer/output/
          if-no-files-found: error
          retention-days: 30
