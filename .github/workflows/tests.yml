name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core fonts-dejavu-core
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -c "import PySide6"
      - name: Use installed Windows fonts in offscreen Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fonts = Join-Path $env:WINDIR 'Fonts'
          if (!(Test-Path $fonts)) { throw 'Windows font directory missing' }
          "QT_QPA_FONTDIR=$fonts" >> $env:GITHUB_ENV
      - name: Reject missing Latin, Persian and technical glyphs
        run: python render_preflight.py
      - name: Run pytest with timing diagnostics
        run: python -m pytest -q --durations=30 --durations-min=0 --junitxml=ci-reports/junit.xml
      - name: Summarize test timings
        if: ${{ always() && hashFiles('ci-reports/junit.xml') != '' }}
        run: python dev_tools/ci_timing.py ci-reports/junit.xml --output ci-reports/timings.md
      - name: Upload test timing evidence
        if: ${{ always() && hashFiles('ci-reports/junit.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.os }}
          path: ci-reports/
          if-no-files-found: error
      - name: Capture actual desktop previews
        run: python capture_workspace.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-previews-${{ matrix.os }}
          path: screenshots/
          if-no-files-found: error
