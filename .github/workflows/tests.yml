name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_candidate:
        description: 'Build an internal Windows candidate after tests'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -c "import PySide6"
      - run: python -m pytest -q
      - name: Source application smoke
        run: python main.py --smoke-test source-smoke.txt
      - name: Capture actual desktop previews
        run: python capture_workspace.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-previews-${{ matrix.os }}
          path: screenshots/
          if-no-files-found: error

  development-build:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/desktop-workspace' && startsWith(github.event.head_commit.message, 'build: candidate')) || (github.event_name == 'workflow_dispatch' && inputs.build_candidate)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
      - name: Run regression and Qt tests
        run: python -m pytest -q
      - name: Build portable development application
        shell: pwsh
        run: ./installer/build.ps1 -PortableOnly
      - name: Smoke test frozen portable application
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'mano-portable-smoke.txt'
          $app = Join-Path $PWD 'dist\ManoStudio\ManoStudio.exe'
          $p = Start-Process -FilePath $app -ArgumentList "--smoke-test `"$report`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Portable smoke timed out.' }
          if ($p.ExitCode -ne 0 -or (Get-Content $report -Raw).Trim() -ne 'PASS') { throw 'Portable smoke failed.' }
      - name: Archive portable candidate and build evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable-output | Out-Null
          $version = (python -c "from update_service import VERSION; print(VERSION)").Trim()
          $zip = "portable-output/ManoStudio-v$version-Windows-x64.zip"
          Compress-Archive -Path dist/ManoStudio -DestinationPath $zip -Force
          python -m pip freeze | Set-Content -Encoding utf8 portable-output/build-dependencies.txt
          "SHA=$env:GITHUB_SHA" | Set-Content -Encoding ascii portable-output/commit.txt
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() | Set-Content -Encoding ascii "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ManoStudio-Windows-x64-portable-development
          path: portable-output/
          if-no-files-found: error
          retention-days: 14
      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build development installer
        shell: pwsh
        run: ./installer/build.ps1 -ReuseFrozen
      - name: Install, run offline smoke test, uninstall
        shell: pwsh
        run: ./installer/smoke.ps1
      - name: Record build dependency versions
        shell: pwsh
        run: python -m pip freeze | Set-Content -Encoding utf8 installer/output/build-dependencies.txt
      - name: Generate SHA256
        shell: pwsh
        run: |
          Get-ChildItem installer/output/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ManoStudio-Windows-x64-development
          path: installer/output/
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-smoke-report
          path: |
            ${{ runner.temp }}/mano-smoke.txt
            ${{ runner.temp }}/mano-portable-smoke.txt
          if-no-files-found: ignore
