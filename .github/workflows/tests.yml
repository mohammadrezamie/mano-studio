name: Tests
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core fonts-dejavu-core
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -c "import PySide6"
      - name: Use installed Windows fonts in offscreen Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fonts = Join-Path $env:WINDIR 'Fonts'
          if (!(Test-Path $fonts)) { throw 'Windows font directory missing' }
          "QT_QPA_FONTDIR=$fonts" >> $env:GITHUB_ENV
      - name: Reject missing Latin, Persian and technical glyphs
        run: python render_preflight.py
      - run: python -m pytest -q --durations=25 --junitxml=regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.os }}
          path: regression.xml
          if-no-files-found: ignore
      - name: Capture actual desktop previews
        run: python capture_workspace.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-previews-${{ matrix.os }}
          path: screenshots/
          if-no-files-found: error
