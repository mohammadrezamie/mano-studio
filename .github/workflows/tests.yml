name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -c "import PySide6"
      - run: python -m pytest -q
      - name: Capture actual desktop previews
        run: python capture_workspace.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-previews-${{ matrix.os }}
          path: screenshots/
          if-no-files-found: error
