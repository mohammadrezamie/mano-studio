name: First-run onboarding acceptance
on:
  pull_request:
    branches: [develop/next-beta]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: onboarding-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  onboarding:
    if: github.head_ref == 'feature/first-run-onboarding' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core fonts-dejavu-core
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q onboarding_state.py ui/onboarding.py main.py
      - run: python -m pytest -q --junitxml=onboarding.xml tests/test_onboarding_state.py tests/test_onboarding_view.py tests/test_settings_language.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-${{ matrix.os }}
          path: onboarding.xml
          if-no-files-found: ignore
