name: Refresh private release drafts with exact rebuilt assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-release-drafts.yml'

permissions: {}

jobs:
  stage:
    if: github.repository == 'mohammadrezamie/mano-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-draft-${{ matrix.track }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: 'stable'
            version: '1.0.0'
            source: '926272ff0ebfa4731cfb0b00c149c7e12b4d5a56'
            native: '46044104396'
            release_id: '460598745'
            setup: '15221272367'
            portable: '15221357225'
            setup_outer: 'f5cc2b631fd722bd6cba629923c83328fb1b4fdab909f8a6c1400377e54ff8e9'
            portable_outer: '6761c9434227b62fdb5f4f6f499d039bbc4d4583ee501c16a5a6869f620cf2e0'
            setup_sha: '3525135132eaabe6039e3c543911ac6429e71e453b53792968e91fb1a142ef9c'
            portable_sha: 'bc93823dbea393f17464886abeef406defda22e4151dbaab82293928eae3271e'
            old_setup: '978f1e02731b6e3aaecf808401f5b66d33b760d0b3780e65d206946f3976889b'
            old_portable: '67406b43ee06cc824e6beb3515785756ef74d5235472cc544f97f8960cdee3f7'
            old_setup_checksum: 'd096a322d192f5b920c2f42f0cc3819982eb1aa9843609064fe41d94bd7d72b1'
            old_portable_checksum: 'b565f5f70d5aece8fbc0698f78f83b823551ebb76df3e0d6316dec0c1065d31f'
          - track: 'beta'
            version: '1.1.0-beta.1'
            source: '2dd55994d36f2596dd3d17ea54dd3c3e43829ae2'
            native: '46043046471'
            release_id: '460607136'
            setup: '15220751219'
            portable: '15220621215'
            setup_outer: '658d794b6da1eb06e4ee31f919c47d1b1a671b68f22bff54e27968124f850ed8'
            portable_outer: 'f7ec16b7620ad1ef02606f9e1c6f9d1202c8760ee89d659e092d3fc71a83fad5'
            setup_sha: '8fcd72cc280892de6c76c76d555ab4c6601b9e9753cb13157ca0c01ee127a0bc'
            portable_sha: 'b6a9e2c0fa4014ce505d68e639a328f6ec193b98655c2f123a93365d3b523109'
            old_setup: '4ce12623d94d334844877bb2c09f1a206b28db9b337a60e82e68c63e2e99dd6b'
            old_portable: '0c61de8c31b100cb2ae0d0a07e8f3135c077479a6381757c14eb651baf4fc873'
            old_setup_checksum: 'b2b611b11d41b79c5ce6260c2e9e681ac1c6007c6a89911efdeab28b57555439'
            old_portable_checksum: 'c2b563cf34e3b384ad56aa5f4ea90b4ee5b249ab6b315ba1186285714d84b79c'
    steps:
      - name: Verify exact rebuilt bytes and refresh private drafts only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRACK: ${{ matrix.track }}
          VERSION: ${{ matrix.version }}
          SOURCE: ${{ matrix.source }}
          BUILD: '46041711466'
          NATIVE: ${{ matrix.native }}
          RELEASE_ID: ${{ matrix.release_id }}
          OLD_SETUP: ${{ matrix.old_setup }}
          OLD_PORTABLE: ${{ matrix.old_portable }}
          OLD_SETUP_CHECKSUM: ${{ matrix.old_setup_checksum }}
          OLD_PORTABLE_CHECKSUM: ${{ matrix.old_portable_checksum }}
          SETUP_ID: ${{ matrix.setup }}
          PORTABLE_ID: ${{ matrix.portable }}
          SETUP_OUTER: ${{ matrix.setup_outer }}
          PORTABLE_OUTER: ${{ matrix.portable_outer }}
          SETUP_SHA: ${{ matrix.setup_sha }}
          PORTABLE_SHA: ${{ matrix.portable_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import zipfile

          e = os.environ
          repo, source, version = e["GH_REPO"], e["SOURCE"], e["VERSION"]
          tag = "v" + version
          base = f"repos/{repo}"
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def gh(*args):
              return subprocess.check_output(["gh", *args])
          def api(endpoint):
              return json.loads(gh("api", endpoint))
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def check_run(run_id, name):
              r = api(f"{base}/actions/runs/{run_id}")
              require(r["name"] == name and r["status"] == "completed" and r["conclusion"] == "success",
                      f"Required workflow {run_id} not successful")
          check_run(e["BUILD"], "Build lean release candidates")
          check_run(e["NATIVE"], "Lean exact installer acceptance")
          jobs = api(f"{base}/actions/runs/{e['BUILD']}/jobs")["jobs"]
          require(any(j["conclusion"] == "success" and j["name"].startswith(f"build ({e['TRACK']}, {source}, ") for j in jobs), "Exact source build job absent")
          endpoint = f"{base}/releases/{e['RELEASE_ID']}"
          def draft():
              r = api(endpoint)
              require(r["draft"] is True and r["prerelease"] == (e["TRACK"] == "beta") and r["tag_name"] == tag,
                      "Not the expected private draft")
              return r
          draft()
          artifacts = api(f"{base}/actions/runs/{e['BUILD']}/artifacts?per_page=100")["artifacts"]
          by_id = {str(a["id"]): a for a in artifacts}
          with tempfile.TemporaryDirectory() as tmp:
              out = pathlib.Path(tmp)
              assets = []
              manifests = []
              for kind, name, artifact_name in (
                  ("SETUP", f"ManoStudio-Setup-{tag}-x64.exe", f"lean-{e['TRACK']}-setup"),
                  ("PORTABLE", f"ManoStudio-{tag}-Windows-x64.zip", f"lean-{e['TRACK']}-portable"),
              ):
                  aid = e[kind + "_ID"]
                  a = by_id.get(aid, {})
                  require(a.get("name") == artifact_name and a.get("expired") is False
                          and a.get("digest") == "sha256:" + e[kind + "_OUTER"], "Artifact identity mismatch")
                  raw = gh("api", f"{base}/actions/artifacts/{aid}/zip")
                  require(sha(raw) == e[kind + "_OUTER"], "Outer artifact checksum mismatch")
                  outer = out / (kind + ".zip")
                  outer.write_bytes(raw)
                  with zipfile.ZipFile(outer) as z:
                      require(z.testzip() is None and len(z.namelist()) == len(set(z.namelist())), "Corrupt or duplicate artifact entries")
                      require(z.read("commit.txt").decode("utf-8-sig").strip() == "SHA=" + source, "Source marker mismatch")
                      require(z.read("portable-smoke.txt").decode("utf-8-sig").strip() == "PASS", "Portable smoke not passed")
                      data = z.read(name)
                      require(sha(data) == e[kind + "_SHA"], "Asset checksum mismatch")
                      p = out / name
                      p.write_bytes(data)
                      checksum = out / (name + ".sha256")
                      checksum.write_text(sha(data) + "  " + name + "\n", encoding="ascii")
                      assets.extend([p, checksum])
                      manifests.append({"name": name, "size": len(data), "sha256": sha(data)})
                      if kind == "SETUP":
                          require(z.read("installed-smoke.txt").decode("utf-8-sig").strip() == "PASS", "Installed smoke not passed")
                          manifest = json.loads(z.read("candidate-manifest.json"))
                          require(manifest["source_sha"] == source and manifest["version"] == version
                                  and manifest["public_release"] is False, "Manifest identity mismatch")
                  if kind == "PORTABLE":
                      with zipfile.ZipFile(p) as z:
                          require(z.testzip() is None, "Corrupt portable payload")
              require(sorted(manifests, key=lambda x: x["name"]) == sorted(manifest["assets"], key=lambda x: x["name"]),
                      "Manifest assets mismatch")
              # Verify all bytes before any draft mutation. Retain old files under review-only names.
              source_artifact = api(f"{base}/actions/artifacts/15220635288")
              source_digest = "e8ad1e1e7c1ca7b7e5e793e54007fe85ad1e3ed95b215c4dba507c8feb9ef129"
              require(source_artifact["expired"] is False and source_artifact["digest"] == "sha256:" + source_digest
                      and source_artifact["workflow_run"]["id"] == 46040755221, "Source review artifact identity mismatch")
              source_raw = gh("api", f"{base}/actions/artifacts/15220635288/zip")
              require(sha(source_raw) == source_digest, "Source review checksum mismatch")
              source_file = out / "Qt-6.12.0-source-REVIEW-ONLY.zip"
              source_file.write_bytes(source_raw)
              with zipfile.ZipFile(source_file) as z:
                  require(z.testzip() is None and len(z.namelist()) == len(set(z.namelist())), "Corrupt source review archive")
              assets.append(source_file)
              source_checksum = out / (source_file.name + ".sha256")
              source_checksum.write_text(source_digest + "  " + source_file.name + "\n", encoding="ascii")
              assets.append(source_checksum)

              old_hashes = {
                  f"ManoStudio-Setup-{tag}-x64.exe": e["OLD_SETUP"],
                  f"ManoStudio-Setup-{tag}-x64.exe.sha256": e["OLD_SETUP_CHECKSUM"],
                  f"ManoStudio-{tag}-Windows-x64.zip": e["OLD_PORTABLE"],
                  f"ManoStudio-{tag}-Windows-x64.zip.sha256": e["OLD_PORTABLE_CHECKSUM"],
              }
              expected = {p.name: "sha256:" + sha(p.read_bytes()) for p in assets}
              notes = (f"# Mano Studio {tag} — PRIVATE DRAFT, NOT APPROVED FOR PUBLICATION\n\n"
                       f"Exact source: {source}\n\nBuild: https://github.com/{repo}/actions/runs/{e['BUILD']}\n\n"
                       f"Hosted Windows acceptance: https://github.com/{repo}/actions/runs/{e['NATIVE']}\n\n"
                       "Draft refresh in progress. Do not publish. Exact full regression, independent visual/native acceptance, "
                       "security, publisher authenticity and corresponding-source/relink approval remain open. "
                       "Source REVIEW-ONLY archive is not a complete corresponding-source offer. Installer unsigned. "
                       "Previous assets retained with OLD-REVIEW-ONLY prefix; remove them before any eventual publication.\n")
              def patch_notes(body):
                  draft()
                  gh("api", "--method", "PATCH", endpoint, "-f", "body=" + body,
                     "-f", "target_commitish=" + source)
                  draft()
              patch_notes(notes)
              for p in assets:
                  existing = {a["name"]:a for a in draft()["assets"]}
                  a = existing.get(p.name)
                  if a is not None and a.get("digest") == expected[p.name]:
                      continue
                  if a is not None:
                      require(p.name in old_hashes and a.get("digest") == "sha256:" + old_hashes[p.name],
                              "Unknown existing asset; refusing replacement")
                      backup = "OLD-REVIEW-ONLY-" + p.name
                      require(backup not in existing, "Backup already exists")
                      gh("api", "--method", "PATCH", f"{base}/releases/assets/{a['id']}", "-f", "name=" + backup)
                  draft()
                  gh("release", "upload", tag, str(p))
                  fresh = {a["name"]: a for a in draft()["assets"]}
                  require(fresh.get(p.name, {}).get("digest") == expected[p.name], "Uploaded digest mismatch")
              fresh = {a["name"]:a for a in draft()["assets"]}
              require(all(fresh.get(n, {}).get("digest") == h for n,h in expected.items()), "Draft refresh incomplete")
              patch_notes(notes.replace("Draft refresh in progress.", "Exact rebuilt Setup/Portable and source review archive staged and hash verified."))
              print("Private draft refreshed; publication intentionally not performed.")
          PY
