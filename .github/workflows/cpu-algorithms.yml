name: CPU algorithm examples
on:
  pull_request:
    branches: [integration/first-beta]
permissions:
  contents: read
jobs:
  examples:
    if: github.head_ref == 'feature/next-beta-cpu-algorithms' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core fonts-dejavu-core
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=cpu-algorithms.xml tests/test_program_samples.py tests/test_program_samples_view.py tests/test_program_samples_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-algorithms-${{ matrix.os }}
          path: cpu-algorithms.xml
          if-no-files-found: ignore
