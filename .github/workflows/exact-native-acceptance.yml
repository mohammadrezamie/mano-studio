name: Corrected exact installer acceptance
on:
  push:
    branches: [release/exact-native-acceptance]
    paths: ['.github/workflows/exact-native-acceptance.yml', 'installer/exact_native_acceptance.ps1']
permissions:
  contents: read
  actions: read
jobs:
  accept:
    if: github.repository == 'mohammadrezamie/mano-studio' && github.ref == 'refs/heads/release/exact-native-acceptance'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - {track: stable, run: 46017522690, artifact: 15211462028, version: '1.0.0', sha256: '11df201f81a8d0daf64e8787d24d7856065d17891205f4b824aedad84ebd1ab4'}
          - {track: beta, run: 46017522690, artifact: 15211969548, version: '1.1.0-beta.1', sha256: '89165622a480b64d59fd906c37947e10df7e6f2d6898e28f1f9aa47a4c31fec7'}
        profile: [isolated-path, pre-equipped]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.candidate.run }}
          artifact-ids: ${{ matrix.candidate.artifact }}
          github-token: ${{ github.token }}
          path: frozen-setup
      - shell: pwsh
        run: |
          $setups = @(Get-ChildItem frozen-setup -Recurse -File -Filter "ManoStudio-Setup-v${{ matrix.candidate.version }}-x64.exe")
          if ($setups.Count -ne 1) { throw 'Expected exactly one frozen installer' }
          ./installer/exact_native_acceptance.ps1 -Setup $setups[0].FullName -ExpectedHash '${{ matrix.candidate.sha256 }}' -Profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-native-${{ matrix.candidate.track }}-${{ matrix.profile }}
          path: native-evidence/
          if-no-files-found: warn
