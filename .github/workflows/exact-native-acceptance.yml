name: Lean exact installer acceptance
on:
  push:
    branches: [release/exact-native-acceptance]
    paths: ['.github/workflows/exact-native-acceptance.yml', 'installer/exact_native_acceptance.ps1']
permissions:
  contents: read
  actions: read
jobs:
  accept:
    if: github.repository == 'mohammadrezamie/mano-studio' && github.ref == 'refs/heads/release/exact-native-acceptance'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - {track: stable, run: 46036183906, artifact: 15218035796, version: '1.0.0', sha256: 'ed66728532cd4cbe71740d6223f476e356cdc866a37eb2eaf112f38c5d5ad673'}
          - {track: beta, run: 46036183906, artifact: 15217285793, version: '1.1.0-beta.1', sha256: '66af9153aeb1674e7f67200650a8cfcf743e15819429d613b989ed42c5120192'}
        profile: [isolated-path, pre-equipped]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.candidate.run }}
          artifact-ids: ${{ matrix.candidate.artifact }}
          github-token: ${{ github.token }}
          path: frozen-setup
      - shell: pwsh
        run: |
          $setups = @(Get-ChildItem frozen-setup -Recurse -File -Filter "ManoStudio-Setup-v${{ matrix.candidate.version }}-x64.exe")
          if ($setups.Count -ne 1) { throw 'Expected exactly one frozen installer' }
          ./installer/exact_native_acceptance.ps1 -Setup $setups[0].FullName -ExpectedHash '${{ matrix.candidate.sha256 }}' -Profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-native-${{ matrix.candidate.track }}-${{ matrix.profile }}
          path: native-evidence/
          if-no-files-found: warn
