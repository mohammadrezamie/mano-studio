name: beta OpenSSL notice acceptance
on:
  push:
    branches: [release/beta-openssl-notice]
permissions:
  contents: read
jobs:
  notice:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_openssl_notice.py tests/test_collect_notices.py tests/test_runtime_evidence.py
