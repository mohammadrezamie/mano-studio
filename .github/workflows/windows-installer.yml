name: Windows candidate installer
on:
  workflow_dispatch:
  pull_request:
    branches: [main, release/v1-candidate, integration/first-beta]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'

permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'release/first-beta-candidate' || github.head_ref == 'release/beta-integrated' || github.head_ref == 'release/beta-final-prep' || github.head_ref == 'release/v1-candidate' || (github.head_ref == 'quality/redistribution-gate' && github.base_ref == 'release/v1-candidate') || (github.head_ref == 'release/beta-packaging-hardening' && github.base_ref == 'integration/first-beta')))
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source revision
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[a-f0-9]{40}$') { throw 'Missing source SHA' }
          "MANO_SOURCE_SHA=$sha" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ (github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'release/beta-packaging-hardening') && '3.14.10' || '3.12' }}
          architecture: x64
      - name: Isolate pinned Windows candidate build environment
        if: github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'release/beta-packaging-hardening'
        shell: pwsh
        run: |
          python -m venv (Join-Path $env:RUNNER_TEMP 'mano-candidate-venv')
          if ($LASTEXITCODE -ne 0) { throw 'Candidate venv failed.' }
          (Join-Path $env:RUNNER_TEMP 'mano-candidate-venv\Scripts') >> $env:GITHUB_PATH
      - name: Install dependencies
        if: github.head_ref != 'quality/redistribution-gate' && github.head_ref != 'release/beta-packaging-hardening'
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
      - name: Install pinned wheels and verify download evidence
        if: github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'release/beta-packaging-hardening'
        shell: pwsh
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --report build-wheel-report.json -c installer/windows-candidate-constraints.txt -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned candidate dependency installation failed.' }
          python -m installer.wheel_evidence build-wheel-report.json installer/windows-candidate-constraints.txt wheel-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Wheel provenance evidence rejected.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Candidate dependency conflict.' }
      - name: Verify redistribution tooling
        if: github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'release/beta-packaging-hardening'
        run: python -m pytest -q tests/test_wheel_evidence.py tests/test_redistribution_gate.py tests/test_windows_zip_paths.py tests/test_prune_qt.py tests/test_runtime_evidence.py tests/test_update_service.py
      - name: Configure Windows fonts for offscreen Qt
        shell: pwsh
        run: |
          $fonts = Join-Path $env:WINDIR 'Fonts'
          if (!(Test-Path $fonts)) { throw 'Windows font directory missing' }
          "QT_QPA_FONTDIR=$fonts" >> $env:GITHUB_ENV
      - name: Verify actual Persian and technical glyphs
        run: python render_preflight.py
      # Full Windows and Ubuntu regression remain independent release gates in Tests.
      # This job produces internal artifacts only and must not repeat the long GUI suite.
      - name: Verify packaging contracts and academic credits
        run: python -m pytest -q tests/test_candidate_manifest.py tests/test_windows_build_contract.py tests/test_localization.py tests/test_collect_notices.py tests/test_instructor_evidence.py tests/test_instructor_gallery.py tests/test_translator_isolation.py tests/test_visual_tokens.py tests/test_first_beta_version.py
      - name: Verify focused instructor UI
        if: github.head_ref == 'release/v1-candidate' || github.head_ref == 'quality/redistribution-gate'
        run: python -m pytest -q -o faulthandler_timeout=60 tests/test_workspace.py -k instructor_splash_variants
      - name: Capture instructor visual evidence
        if: github.head_ref == 'release/v1-candidate' || github.head_ref == 'quality/redistribution-gate'
        run: python capture_instructor.py instructor-preview
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'release/v1-candidate' || github.head_ref == 'quality/redistribution-gate'
        with:
          name: ManoStudio-v1-instructor-preview
          path: instructor-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Build portable candidate application
        shell: pwsh
        run: ./installer/build.ps1 -PortableOnly
      - name: Smoke test frozen portable application
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'mano-portable-smoke.txt'
          if (Test-Path $report) { Remove-Item $report -Force }
          $app = Join-Path $PWD 'dist\ManoStudio\ManoStudio.exe'
          $p = Start-Process -FilePath $app -ArgumentList "--smoke-test `"$report`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Portable smoke timed out.' }
          if ($p.ExitCode -ne 0 -or !(Test-Path $report) -or (Get-Content $report -Raw).Trim() -ne 'PASS') { throw 'Portable smoke failed.' }
      - name: Archive portable candidate and build evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable-output | Out-Null
          $version = (python -c "from update_service import VERSION; print(VERSION)").Trim()
          $zip = "portable-output/ManoStudio-v$version-Windows-x64.zip"
          python -c "import shutil,sys; shutil.make_archive(sys.argv[1],'zip',root_dir='dist',base_dir='ManoStudio')" ($zip -replace '\.zip$', '')
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive failed.' }
          python -m pip freeze | Set-Content -Encoding utf8 portable-output/build-dependencies.txt
          "SHA=$env:MANO_SOURCE_SHA" | Set-Content -Encoding ascii portable-output/commit.txt
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() | Set-Content -Encoding ascii "$zip.sha256"
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mano-portable-smoke.txt') portable-output/portable-smoke.txt
      - name: Record redistribution review evidence
        if: github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'release/beta-packaging-hardening'
        shell: pwsh
        run: |
          $zip = Get-ChildItem portable-output/*.zip | Select-Object -First 1
          python -m installer.redistribution_gate $zip.FullName | Set-Content -Encoding utf8 portable-output/redistribution-preflight.json
          if ($LASTEXITCODE -notin @(0,2)) { throw 'Invalid distribution evidence.' }
          python -m installer.runtime_evidence $zip.FullName portable-output/runtime-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Invalid runtime evidence.' }
          Copy-Item wheel-evidence.json portable-output/
          Copy-Item installer/windows-candidate-constraints.txt portable-output/
      - uses: actions/upload-artifact@v4
        with:
          name: ManoStudio-Windows-x64-portable-development
          path: portable-output/
          if-no-files-found: error
          retention-days: 14
      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build candidate installer
        shell: pwsh
        run: ./installer/build.ps1 -ReuseFrozen
      - name: Install, run offline smoke test, uninstall
        shell: pwsh
        run: ./installer/smoke.ps1
      - name: Record build dependency versions and source
        shell: pwsh
        run: |
          python -m pip freeze | Set-Content -Encoding utf8 installer/output/build-dependencies.txt
          "SHA=$env:MANO_SOURCE_SHA" | Set-Content -Encoding ascii installer/output/commit.txt
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mano-smoke.txt') installer/output/installed-smoke.txt
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mano-installed-payload.json') installer/output/installed-payload.json
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mano-portable-smoke.txt') installer/output/portable-smoke.txt
      - name: Include redistribution review evidence with Setup
        if: github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'release/beta-packaging-hardening'
        shell: pwsh
        run: |
          Copy-Item portable-output/redistribution-preflight.json installer/output/
          Copy-Item portable-output/runtime-evidence.json installer/output/
          Copy-Item wheel-evidence.json installer/output/
          Copy-Item installer/windows-candidate-constraints.txt installer/output/
      - name: Generate SHA256
        shell: pwsh
        run: |
          Get-ChildItem installer/output/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Validate both candidate assets and record manifest
        run: python installer/candidate_manifest.py --root . --sha "${{ env.MANO_SOURCE_SHA }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ManoStudio-Windows-x64-development
          path: installer/output/
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-smoke-report
          path: |
            ${{ runner.temp }}/mano-smoke.txt
            ${{ runner.temp }}/mano-portable-smoke.txt
          if-no-files-found: ignore
