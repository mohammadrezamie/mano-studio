name: beta installer trust contracts
on:
  pull_request:
    branches: [develop/next-beta]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  preflight:
    if: github.head_ref == 'feature/beta-installer-trust' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_installer_trust.py tests/test_update_download.py tests/test_release_channel.py
