name: Native acceptance record contracts
on:
  pull_request:
    branches: [quality/redistribution-gate]
permissions:
  contents: read
jobs:
  records:
    if: github.head_ref == 'quality/native-release-acceptance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_native_acceptance.py
