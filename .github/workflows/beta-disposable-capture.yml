name: Beta disposable capture acceptance
on:
  pull_request:
    branches: [release/beta-verified-regression]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  visual:
    if: github.head_ref == 'quality/beta-disposable-captures' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.os == 'windows-latest' && (github.head_ref == 'release/beta-verified-regression' || github.head_ref == 'quality/beta-disposable-captures') && '3.14.10' || '3.12' }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core fonts-dejavu-core
      - name: Install ordinary regression dependencies
        if: matrix.os != 'windows-latest' || (github.head_ref != 'release/beta-verified-regression' && github.head_ref != 'quality/beta-disposable-captures')
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Isolate exact Windows regression environment
        if: matrix.os == 'windows-latest' && (github.head_ref == 'release/beta-verified-regression' || github.head_ref == 'quality/beta-disposable-captures')
        shell: pwsh
        run: |
          python -m venv (Join-Path $env:RUNNER_TEMP 'mano-regression-venv')
          if ($LASTEXITCODE -ne 0) { throw 'Regression venv failed.' }
          (Join-Path $env:RUNNER_TEMP 'mano-regression-venv\Scripts') >> $env:GITHUB_PATH
      - name: Install exact Windows candidate dependencies
        if: matrix.os == 'windows-latest' && (github.head_ref == 'release/beta-verified-regression' || github.head_ref == 'quality/beta-disposable-captures')
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --report regression-wheel-report.json -c installer/windows-candidate-constraints.txt -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned regression dependencies failed.' }
          python -m installer.wheel_evidence regression-wheel-report.json installer/windows-candidate-constraints.txt regression-wheel-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Regression wheel evidence rejected.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Regression dependency conflict.' }
      - run: python -c "import PySide6"
      - name: Use installed Windows fonts in offscreen Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fonts = Join-Path $env:WINDIR 'Fonts'
          if (!(Test-Path $fonts)) { throw 'Windows font directory missing' }
          "QT_QPA_FONTDIR=$fonts" >> $env:GITHUB_ENV
      - name: Reject missing Latin, Persian and technical glyphs
        run: python render_preflight.py
      - name: Focused capture lifecycle and visual contracts
        run: python -m pytest -q tests/test_capture_lifecycle.py tests/test_visual_review.py tests/test_instructor_evidence.py
      - name: Capture actual desktop previews
        timeout-minutes: 5
        run: python -X faulthandler capture_workspace.py
      - name: Capture instructor matrix
        run: python capture_instructor.py instructor-preview
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-desktop-${{ matrix.os }}
          path: screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-instructor-${{ matrix.os }}
          path: instructor-preview/
          if-no-files-found: error
