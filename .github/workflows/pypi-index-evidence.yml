name: Independent PyPI index evidence
on:
  pull_request:
    branches: [quality/redistribution-gate]
permissions:
  contents: read
  actions: read
jobs:
  index-review:
    if: github.head_ref == 'quality/pypi-index-evidence' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_pypi_index_evidence.py tests/test_wheel_evidence.py
      - uses: actions/download-artifact@v4
        with:
          name: ManoStudio-Windows-x64-development
          run-id: '45956324583'
          github-token: ${{ github.token }}
          path: candidate
      - run: python -m installer.pypi_index_evidence candidate --source e4bae9ed7b5112f1499d02bcfc20db66fb9085dd --output pypi-index-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-candidate-pypi-index-evidence
          path: pypi-index-evidence.json
          if-no-files-found: error
