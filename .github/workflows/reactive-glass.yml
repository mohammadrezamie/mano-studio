name: Reactive glass acceptance
on:
  pull_request:
    branches: [feature/next-beta-cpu-algorithms]
permissions:
  contents: read
jobs:
  visual:
    if: github.head_ref == 'feature/reactive-glass-audit' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core fonts-dejavu-core
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=reactive-glass.xml tests/test_reactive_glass.py tests/test_vivid_refresh.py tests/test_visual_tokens.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reactive-glass-${{ matrix.os }}
          path: reactive-glass.xml
          if-no-files-found: ignore
