name: Stable parallel regression v2
on:
  pull_request:
    branches: [quality/redistribution-gate]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  test:
    if: github.head_ref == 'ci/stable-parallel-v2' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.os == 'windows-latest' && (github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'ci/stable-parallel-v2') && '3.14.10' || '3.12' }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core fonts-dejavu-core
      - name: Install ordinary regression dependencies
        if: matrix.os != 'windows-latest' || (github.head_ref != 'quality/redistribution-gate' && github.head_ref != 'ci/stable-parallel-v2')
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Isolate exact Windows regression environment
        if: matrix.os == 'windows-latest' && (github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'ci/stable-parallel-v2')
        shell: pwsh
        run: |
          python -m venv (Join-Path $env:RUNNER_TEMP 'mano-regression-venv')
          if ($LASTEXITCODE -ne 0) { throw 'Regression venv failed.' }
          (Join-Path $env:RUNNER_TEMP 'mano-regression-venv\Scripts') >> $env:GITHUB_PATH
      - name: Install exact Windows candidate dependencies
        if: matrix.os == 'windows-latest' && (github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'ci/stable-parallel-v2')
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --report regression-wheel-report.json -c installer/windows-candidate-constraints.txt -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned regression dependencies failed.' }
          python -m installer.wheel_evidence regression-wheel-report.json installer/windows-candidate-constraints.txt regression-wheel-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Regression wheel evidence rejected.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Regression dependency conflict.' }
      - run: python -c "import PySide6"
      - name: Use installed Windows fonts in offscreen Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fonts = Join-Path $env:WINDIR 'Fonts'
          if (!(Test-Path $fonts)) { throw 'Windows font directory missing' }
          "QT_QPA_FONTDIR=$fonts" >> $env:GITHUB_ENV
      - name: Reject missing Latin, Persian and technical glyphs
        run: python render_preflight.py
      - name: Record regression source and environment
        run: |
          git rev-parse HEAD > regression-source.txt
          python --version > regression-python.txt
          python -m pip freeze > regression-dependencies.txt
      - run: python -m pytest -p ci_shard --shard-index=${{ matrix.shard }} --shard-count=2 --shard-profile=ci/timing-${{ matrix.os }}.json --shard-report=shard.json -q --durations=25 --junitxml=regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            regression.xml
            shard.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-environment-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            regression-source.txt
            regression-python.txt
            regression-dependencies.txt
            regression-wheel-evidence.json
          if-no-files-found: ignore
  visual:
    if: github.head_ref == 'ci/stable-parallel-v2' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.os == 'windows-latest' && (github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'ci/stable-parallel-v2') && '3.14.10' || '3.12' }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core fonts-dejavu-core
      - name: Install ordinary regression dependencies
        if: matrix.os != 'windows-latest' || (github.head_ref != 'quality/redistribution-gate' && github.head_ref != 'ci/stable-parallel-v2')
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Isolate exact Windows regression environment
        if: matrix.os == 'windows-latest' && (github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'ci/stable-parallel-v2')
        shell: pwsh
        run: |
          python -m venv (Join-Path $env:RUNNER_TEMP 'mano-regression-venv')
          if ($LASTEXITCODE -ne 0) { throw 'Regression venv failed.' }
          (Join-Path $env:RUNNER_TEMP 'mano-regression-venv\Scripts') >> $env:GITHUB_PATH
      - name: Install exact Windows candidate dependencies
        if: matrix.os == 'windows-latest' && (github.head_ref == 'quality/redistribution-gate' || github.head_ref == 'ci/stable-parallel-v2')
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --report regression-wheel-report.json -c installer/windows-candidate-constraints.txt -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned regression dependencies failed.' }
          python -m installer.wheel_evidence regression-wheel-report.json installer/windows-candidate-constraints.txt regression-wheel-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Regression wheel evidence rejected.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Regression dependency conflict.' }
      - run: python -c "import PySide6"
      - name: Use installed Windows fonts in offscreen Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fonts = Join-Path $env:WINDIR 'Fonts'
          if (!(Test-Path $fonts)) { throw 'Windows font directory missing' }
          "QT_QPA_FONTDIR=$fonts" >> $env:GITHUB_ENV
      - name: Reject missing Latin, Persian and technical glyphs
        run: python render_preflight.py
      - name: Capture actual desktop previews
        run: python capture_workspace.py
      - name: Capture instructor matrix
        run: python capture_instructor.py instructor-preview
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-desktop-${{ matrix.os }}
          path: screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-instructor-${{ matrix.os }}
          path: instructor-preview/
          if-no-files-found: error
  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*-latest-*
          path: reports
      - run: python -m ci_shard --reports reports --count 2 --profile-dir ci --profile-out observed-timings --source "${{ github.event.pull_request.head.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-observed-timings
          path: observed-timings/
          if-no-files-found: error
  acceptance:
    needs: [coverage, visual]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Complete regression and both visual matrices succeeded."
