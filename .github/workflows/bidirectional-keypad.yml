name: Bidirectional keypad acceptance
on:
  pull_request:
    branches: [develop/next-beta]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: keypad-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  keypad:
    if: github.head_ref == 'feature/bidirectional-keypad' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core fonts-dejavu-core
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Keypad and reverse translation regressions
        run: python -m pytest -q --junitxml=keypad.xml tests/test_bidirectional_keypad.py
      - name: Existing editor and startup contracts
        run: python -m pytest -q --junitxml=editor.xml tests/test_workspace.py -k "builder_and_pad or pad_replaces_selection or reverse_builder_and_mapping or optional_reverse_import or instructor_source_and_splash"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keypad-${{ matrix.os }}
          path: |
            keypad.xml
            editor.xml
          if-no-files-found: ignore
