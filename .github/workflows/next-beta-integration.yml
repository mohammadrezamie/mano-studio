name: Next-beta integration
on:
  push:
    branches: [develop/next-beta]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [develop/next-beta]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('next-beta-integration-pr-{0}', github.event.pull_request.number) || 'next-beta-integration' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  focused:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'fix/beta-native-document-integrity' || github.event.pull_request.head.ref == 'feature/cpu-sample-ui-acceptance' || github.event.pull_request.head.ref == 'develop/visual-polish' || github.event.pull_request.head.ref == 'feature/cycle-view-acceptance'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt libraries and fonts
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core fonts-dejavu-core
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile and preflight
        id: preflight
        run: |
          python -m compileall -q .
          python -c "import PySide6"
          python render_preflight.py
      - name: Focused model and persistence regression
        run: >-
          python -m pytest -q -o faulthandler_timeout=90 --junitxml=next-core.xml
          tests/test_logic_engine.py tests/test_carry_lookahead.py
          tests/test_mux_network.py tests/test_mux_synthesis.py
          tests/test_classic_samples.py tests/test_block_composition.py
          tests/test_circuit_file.py tests/test_native_file.py
          tests/test_native_exercise.py tests/test_state_session.py tests/test_session_guard.py
          tests/test_databus_lab.py tests/test_databus_file.py
          tests/test_databus_samples.py tests/test_databus_alu.py
          tests/test_update_service.py tests/test_release_channel.py tests/test_update_download.py
          tests/test_update_progress.py tests/test_localization.py
          tests/test_learning_catalog.py tests/test_storage_elements.py
          tests/test_timing_constraints.py tests/test_flipflop_reference.py
          tests/test_academic_source.py tests/test_source_metrics.py tests/test_program_samples.py tests/test_cpu_session.py tests/test_cpu_memory_image.py tests/test_cpu_memory_workflow.py tests/test_cpu_guard.py tests/test_cpu_documents.py tests/test_replacement_guard.py tests/test_memory_inspector.py tests/test_memory_navigation.py tests/test_memory_refresh.py tests/test_memory_export.py tests/test_memory_edit.py tests/test_word_decode.py
      - name: Focused Qt regressions
        if: always() && steps.preflight.outcome == 'success'
        run: >-
          python -m pytest -q -o faulthandler_timeout=90 --junitxml=next-qt.xml
          tests/test_timing_view.py tests/test_cycle_view.py tests/test_flipflop_reference_view.py
          tests/test_storage_view.py tests/test_universal_view.py tests/test_update_view.py tests/test_program_samples_view.py tests/test_program_samples_ui.py tests/test_cpu_session_view.py tests/test_cpu_guard_view.py tests/test_memory_inspector_view.py
      - name: Integrated workspace regressions
        if: always() && steps.preflight.outcome == 'success'
        run: >-
          python -m pytest -q -o faulthandler_timeout=90 --junitxml=next-workspace.xml
          tests/test_workspace.py
          -k 'lookahead_preset or karnaugh_mux_build or library_and_block_insertion or saved_block_import or databus_lesson or native_databus_save_open or native_state_session or state_session_close_guard or databus_alu_controls or exercise_file_actions or instructor_source_and_splash'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-beta-junit-${{ github.event.pull_request.head.sha || github.sha }}
          path: next-*.xml
          if-no-files-found: ignore
